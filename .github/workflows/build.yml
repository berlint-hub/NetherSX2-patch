name: Build NetherSX2 and Patch APKs

on:
  schedule:
    - cron: '0 0 * * *'
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      force_release:
        description: 'Force creating a GitHub Release regardless of PCSX2 commit status'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'true'
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xdelta3 zipalign
          pip install ruamel.yaml
          mkdir -p decomp/lib
          if [ ! -f decomp/lib/baksmali.jar ]; then
            curl -sL -o decomp/lib/baksmali.jar https://bitbucket.org/JesusFreke/smali/downloads/baksmali-2.5.2.jar
          fi
          if [ ! -f decomp/lib/smali.jar ]; then
            curl -sL -o decomp/lib/smali.jar https://bitbucket.org/JesusFreke/smali/downloads/smali-2.5.2.jar
          fi

      - name: Sync PCSX2 Submodule to Latest Upstream
        run: |
          PREV_PCSX2_COMMIT=$(git rev-parse HEAD:pcsx2 2>/dev/null || true)
          echo "PREV_PCSX2_COMMIT=${PREV_PCSX2_COMMIT}" >> $GITHUB_ENV
          echo "Previous PCSX2 submodule commit was: ${PREV_PCSX2_COMMIT}"
          echo "Updating PCSX2 submodule to latest upstream master..."
          git submodule update --init pcsx2
          git -C pcsx2 fetch --depth=100 origin master
          git -C pcsx2 checkout FETCH_HEAD

      - name: Check PCSX2 Upstream Commit Status
        id: check_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RECENT_COMMIT=$(git -C pcsx2 rev-parse --short HEAD)
          RAW_VER=$(git -C pcsx2 describe --tags --always 2>/dev/null || echo "2.9.122")
          PCSX2_VERSION="${RAW_VER#v}"
          BUILD_DATE=$(date +'%d%m%Y')
          TAG_NAME="${RECENT_COMMIT}-${PCSX2_VERSION}-${BUILD_DATE}"

          echo "PCSX2 Commit: ${RECENT_COMMIT}"
          echo "PCSX2 Version: ${PCSX2_VERSION}"
          echo "Build Date: ${BUILD_DATE}"
          echo "Proposed Release Tag: ${TAG_NAME}"

          echo "RECENT_COMMIT=${RECENT_COMMIT}" >> $GITHUB_ENV
          echo "PCSX2_VERSION=${PCSX2_VERSION}" >> $GITHUB_ENV
          echo "BUILD_DATE=${BUILD_DATE}" >> $GITHUB_ENV
          echo "TAG_NAME=${TAG_NAME}" >> $GITHUB_ENV

          # Get previous release commit tag if one exists
          PREV_RELEASE_TAG=$(gh release list -R "${{ github.repository }}" --limit 10 --json tagName -q ".[].tagName" 2>/dev/null | grep -E "^[0-9a-f]{7,}-" | head -n 1 || true)
          PREV_RELEASE_COMMIT=""
          if [ -n "$PREV_RELEASE_TAG" ]; then
            PREV_RELEASE_COMMIT=$(echo "$PREV_RELEASE_TAG" | cut -d'-' -f1)
          fi
          echo "PREV_RELEASE_COMMIT=${PREV_RELEASE_COMMIT}" >> $GITHUB_ENV

          # Check if any existing release tag starts with ${RECENT_COMMIT}-
          EXISTING_RELEASE=$(gh release list -R "${{ github.repository }}" --limit 100 --json tagName -q ".[].tagName" 2>/dev/null | grep -E "^${RECENT_COMMIT}-" || true)

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "Pull request build: skipping release creation."
            echo "SHOULD_RELEASE=false" >> $GITHUB_ENV
          elif [ "${{ github.event.inputs.force_release }}" = "true" ]; then
            echo "force_release requested via workflow_dispatch: release will be created."
            echo "SHOULD_RELEASE=true" >> $GITHUB_ENV
          elif [ -n "$EXISTING_RELEASE" ]; then
            echo "No new PCSX2 commit: commit ${RECENT_COMMIT} already released in ${EXISTING_RELEASE}."
            echo "Skipping release creation (APKs will be stored as artifacts)."
            echo "SHOULD_RELEASE=false" >> $GITHUB_ENV
          else
            echo "New PCSX2 commit detected: ${RECENT_COMMIT} has not been released yet."
            echo "Release will be created: ${TAG_NAME}"
            echo "SHOULD_RELEASE=true" >> $GITHUB_ENV
          fi

      - name: Update PCSX2 Emulation Assets
        run: |
          python3 -c "
          import urllib.request, subprocess, os
          try:
              if os.path.exists('pcsx2/bin/resources/GameIndex.yaml'):
                  print('Using GameIndex.yaml from PCSX2 submodule...')
                  gamedb_src = 'pcsx2/bin/resources/GameIndex.yaml'
              else:
                  print('Fetching latest GameIndex.yaml from PCSX2 upstream...')
                  urllib.request.urlretrieve('https://raw.githubusercontent.com/pcsx2/pcsx2/master/bin/resources/GameIndex.yaml', 'GameIndex_upstream.yaml')
                  gamedb_src = 'GameIndex_upstream.yaml'
              print('Fetching latest gamecontrollerdb.txt from SDL upstream...')
              urllib.request.urlretrieve('https://raw.githubusercontent.com/mdqinc/SDL_GameControllerDB/master/gamecontrollerdb.txt', 'assets/game_controller_db.txt')
              print('Converting updated PCSX2 GameDB...')
              subprocess.run(['python3', 'gamedb-convert.py', gamedb_src], check=True)
              if os.path.exists('GameIndex_upstream.yaml'):
                  os.remove('GameIndex_upstream.yaml')
              print('✓ Upstream PCSX2 emulation system updated successfully')
          except Exception as e:
              print(f'Notice: Using repository committed PCSX2 assets ({e})')
          "

      - name: Build Native libemucore.so (Android NDK)
        run: |
          NDK_PATH="${ANDROID_NDK_ROOT:-$ANDROID_NDK_HOME}"
          if [ -z "$NDK_PATH" ] && [ -d "/usr/local/lib/android/sdk/ndk" ]; then
            NDK_PATH=$(find /usr/local/lib/android/sdk/ndk -maxdepth 1 -mindepth 1 | sort -V | tail -n 1)
          fi
          if [ -n "$NDK_PATH" ] && [ -d "$NDK_PATH" ]; then
            echo "Using Android NDK at: $NDK_PATH"
            cmake -B native/build \
              -DCMAKE_TOOLCHAIN_FILE="$NDK_PATH/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI=arm64-v8a \
              -DANDROID_PLATFORM=android-29 \
              -DCMAKE_BUILD_TYPE=Release \
              native
            cmake --build native/build -j$(nproc)
            echo "✓ Compiled libemucore.so successfully"
          else
            echo "Notice: Android NDK not detected, skipping native compilation"
          fi

      - name: Build NetherSX2 and Patch APKs
        run: python3 scripts/build.py

      - name: Upload NetherSX2 Adreno APK
        uses: actions/upload-artifact@v4
        with:
          name: xyz.nethersx2.android_adreno.apk
          path: xyz.nethersx2.android_adreno.apk
          if-no-files-found: error

      - name: Upload NetherSX2 Mali APK
        uses: actions/upload-artifact@v4
        with:
          name: xyz.nethersx2.android_mali.apk
          path: xyz.nethersx2.android_mali.apk
          if-no-files-found: error

      - name: Upload Switch APK
        uses: actions/upload-artifact@v4
        with:
          name: xyz.aethersx2.android_switch.apk
          path: xyz.aethersx2.android_switch.apk
          if-no-files-found: error

      - name: Upload xdelta
        uses: actions/upload-artifact@v4
        with:
          name: xyz.aethersx2.android_.xdelta
          path: xyz.aethersx2.android_.xdelta
          if-no-files-found: error

      - name: Upload libemucore.so
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: libemucore.so
          path: native/build/libemucore.so
          if-no-files-found: ignore

      - name: Generate Detailed Release Notes
        if: env.SHOULD_RELEASE == 'true'
        run: |
          COMMITS_LOG=""
          if [ -n "$PREV_RELEASE_COMMIT" ] && [ "$PREV_RELEASE_COMMIT" != "$RECENT_COMMIT" ] && git -C pcsx2 cat-file -e "$PREV_RELEASE_COMMIT" 2>/dev/null; then
            echo "Listing commits since previous release ($PREV_RELEASE_COMMIT)..."
            COMMITS_LOG=$(git -C pcsx2 log "${PREV_RELEASE_COMMIT}..HEAD" --format="* [\`%h\`](https://github.com/pcsx2/pcsx2/commit/%H) - %s (%an)")
          elif [ -n "$PREV_PCSX2_COMMIT" ] && [ "$PREV_PCSX2_COMMIT" != "$(git -C pcsx2 rev-parse HEAD)" ] && git -C pcsx2 cat-file -e "$PREV_PCSX2_COMMIT" 2>/dev/null; then
            echo "Listing commits since previous submodule commit ($PREV_PCSX2_COMMIT)..."
            COMMITS_LOG=$(git -C pcsx2 log "${PREV_PCSX2_COMMIT}..HEAD" --format="* [\`%h\`](https://github.com/pcsx2/pcsx2/commit/%H) - %s (%an)")
          fi

          if [ -z "$COMMITS_LOG" ]; then
            echo "Falling back to commits within the last 1 day..."
            COMMITS_LOG=$(git -C pcsx2 log --since="1 day ago" --format="* [\`%h\`](https://github.com/pcsx2/pcsx2/commit/%H) - %s (%an)")
          fi

          if [ -z "$COMMITS_LOG" ]; then
            echo "Falling back to recent commits..."
            COMMITS_LOG=$(git -C pcsx2 log -n 5 --format="* [\`%h\`](https://github.com/pcsx2/pcsx2/commit/%H) - %s (%an)")
          fi

          cat << EOF > release_notes.md
          Upstream PCSX2 Version: ${PCSX2_VERSION}
          Upstream Commit: ${RECENT_COMMIT}
          Build Date: ${BUILD_DATE}

          ### Upstream PCSX2 Commits:
          ${COMMITS_LOG}
          EOF

          sed -i 's/^[ \t]*//' release_notes.md
          cat release_notes.md

      - name: Create GitHub Release
        if: env.SHOULD_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Publishing GitHub Release ${TAG_NAME}..."
          FILES_TO_RELEASE="xyz.nethersx2.android_adreno.apk xyz.nethersx2.android_mali.apk xyz.aethersx2.android_switch.apk xyz.aethersx2.android_.xdelta"
          if [ -f "native/build/libemucore.so" ]; then
            FILES_TO_RELEASE="$FILES_TO_RELEASE native/build/libemucore.so"
          fi
          gh release create "${TAG_NAME}" $FILES_TO_RELEASE \
            --title "${TAG_NAME}" \
            --notes-file release_notes.md
